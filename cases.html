<!DOCTYPE html><html lang="en-GB"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Case Workspace · BIL</title><style>
:root{--bg:#07111f;--panel:#0e1b2e;--panel2:#13243c;--line:#24405f;--ink:#f4f7fb;--muted:#9fb0c5;--blue:#2478ff;--cyan:#61b7ff;--gold:#f4bd45;--green:#54c987;--danger:#ff6c7a}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 8% 0%,rgba(36,120,255,.2),transparent 35%),linear-gradient(180deg,#06101d,#091526);color:var(--ink);min-height:100vh}.wrap{max-width:1200px;margin:auto;padding:24px 16px 60px}.hero{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);font-weight:800}h1{font-size:clamp(30px,5vw,48px);margin:8px 0;letter-spacing:-.04em}.lead{color:var(--muted);max-width:720px;line-height:1.55}.grid{display:grid;grid-template-columns:.85fr 1.15fr;gap:16px;margin-top:18px}.card{background:linear-gradient(160deg,rgba(20,40,67,.97),rgba(10,24,42,.97));border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:18px}.field{margin-bottom:12px}label{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.09em;font-weight:800;margin-bottom:6px}input,select,textarea{width:100%;background:#07111f;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit}textarea{min-height:100px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:12px 15px;background:var(--blue);color:#fff;font-weight:800}.btn.secondary{background:transparent;border:1px solid var(--line)}.btn.danger{background:transparent;border:1px solid rgba(255,108,122,.5);color:var(--danger)}.search{margin-bottom:12px}.case{border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:9px;background:rgba(255,255,255,.025);cursor:pointer}.case:hover{border-color:var(--cyan)}.case-top{display:flex;justify-content:space-between;gap:10px}.case b{font-size:15px}.meta{color:var(--muted);font-size:12px;margin-top:5px}.pill{font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:4px 8px;border-radius:999px;border:1px solid var(--line);color:var(--cyan)}.empty{color:var(--muted);border:1px dashed var(--line);padding:24px;border-radius:12px;text-align:center}.chrono{margin-top:12px}.event{border-left:3px solid var(--cyan);padding:8px 10px;margin:8px 0;background:rgba(97,183,255,.04)}.event time{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}.topbtn{white-space:nowrap}@media(max-width:850px){.grid{grid-template-columns:1fr}.hero{display:block}.topbtn{margin-top:12px}.row{grid-template-columns:1fr}}@media(max-width:520px){.wrap{padding:18px 12px 44px}.btn{min-height:46px;flex:1}.card{padding:14px}}
</style></head><body><main class="wrap"><div class="hero"><div><div class="eyebrow">Behavioural Intelligence Lab</div><h1>Case Workspace</h1><p class="lead">Create and reopen local case records. Data remains on this device unless you export it.</p></div><button class="btn secondary topbtn" id="back">← Suite</button></div><div class="grid"><section class="card"><div class="row"><div class="field"><label>Case reference</label><input id="ref" placeholder="e.g. LA-2026-014"></div><div class="field"><label>Status</label><select id="status"><option>Draft</option><option>Active</option><option>Review</option><option>Final</option><option>Closed</option></select></div></div><div class="row"><div class="field"><label>Case type</label><select id="type"><option>Child welfare</option><option>Adult safeguarding</option><option>Domestic abuse</option><option>Behaviour profile</option><option>Other</option></select></div><div class="field"><label>Practitioner</label><input id="worker" placeholder="Name or initials"></div></div><div class="field"><label>Subject / non-identifying reference</label><input id="subject" placeholder="Initials or internal reference"></div><div class="field"><label>Summary</label><textarea id="summary" placeholder="Brief factual case summary"></textarea></div><div class="field"><label>Add chronology entry</label><textarea id="eventText" placeholder="What happened? Keep observed fact separate from interpretation."></textarea></div><div class="actions"><button class="btn" id="save">Save case</button><button class="btn secondary" id="new">New</button><button class="btn danger" id="delete">Delete</button></div><div id="chrono" class="chrono"></div></section><section class="card"><input class="search" id="search" placeholder="Search by reference, subject, type or practitioner"><div id="list"></div></section></div></main><script>
const KEY='bil-cases-v1';let current=null;const $=id=>document.getElementById(id);const fields=['ref','status','type','worker','subject','summary'];function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function store(x){localStorage.setItem(KEY,JSON.stringify(x))}function esc(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const q=$('search').value.toLowerCase();const rows=load().filter(c=>JSON.stringify(c).toLowerCase().includes(q)).sort((a,b)=>b.updated.localeCompare(a.updated));$('list').innerHTML=rows.length?rows.map(c=>`<div class="case" data-id="${c.id}"><div class="case-top"><b>${esc(c.ref||'Untitled case')}</b><span class="pill">${esc(c.status)}</span></div><div class="meta">${esc(c.type)} · ${esc(c.subject||'No subject')} · Updated ${new Date(c.updated).toLocaleString('en-GB')}</div></div>`).join(''):'<div class="empty">No cases found.</div>';document.querySelectorAll('.case').forEach(el=>el.onclick=()=>openCase(el.dataset.id))}function openCase(id){const c=load().find(x=>x.id===id);if(!c)return;current=id;fields.forEach(f=>$(f).value=c[f]||'');renderChrono(c)}function renderChrono(c){$('chrono').innerHTML=(c.events||[]).length?'<label>Chronology</label>'+c.events.map(e=>`<div class="event"><time>${new Date(e.at).toLocaleString('en-GB')}</time>${esc(e.text)}</div>`).join(''):''}function clearForm(){current=null;fields.forEach(f=>$(f).value='');$('eventText').value='';$('chrono').innerHTML=''}$('save').onclick=()=>{const all=load();const now=new Date().toISOString();let c=current?all.find(x=>x.id===current):null;if(!c){c={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),created:now,events:[]};all.push(c);current=c.id}fields.forEach(f=>c[f]=$(f).value.trim());c.updated=now;const t=$('eventText').value.trim();if(t){c.events.push({at:now,text:t});$('eventText').value=''}store(all);render();renderChrono(c)};$('new').onclick=clearForm;$('delete').onclick=()=>{if(!current)return;if(confirm('Delete this local case?')){store(load().filter(x=>x.id!==current));clearForm();render()}};$('search').oninput=render;$('back').onclick=()=>parent.postMessage('home','*');render();
</script></body></html>
