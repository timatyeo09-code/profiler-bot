<!DOCTYPE html><html lang="en-GB"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>Manager Dashboard · BIL</title><style>
:root{--bg:#07111f;--panel:#0e1b2e;--line:#24405f;--ink:#f4f7fb;--muted:#9fb0c5;--blue:#2478ff;--cyan:#61b7ff;--green:#54c987;--amber:#e0a040;--danger:#ff6c7a}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 8% 0%,rgba(36,120,255,.2),transparent 35%),linear-gradient(180deg,#06101d,#091526);color:var(--ink);min-height:100vh}.wrap{max-width:1380px;margin:auto;padding:28px 18px 60px}.hero{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);font-weight:800}h1{font-size:clamp(32px,5vw,52px);margin:8px 0;letter-spacing:-.04em}.lead{color:var(--muted)}.btn{border:1px solid var(--line);background:transparent;color:var(--ink);padding:11px 14px;border-radius:9px;font-weight:800;cursor:pointer}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:24px 0}.metric,.card{background:linear-gradient(160deg,rgba(20,40,67,.97),rgba(10,24,42,.97));border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:16px}.metric .n{font-size:30px;font-weight:900}.metric .l{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}.card h2{font-size:14px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 12px}.case{display:grid;grid-template-columns:1.2fr .8fr .7fr .7fr;gap:8px;padding:11px;border-top:1px solid var(--line);align-items:center}.case:first-of-type{border-top:0}.pill{display:inline-block;padding:4px 8px;border-radius:99px;font-size:10px;font-weight:800;border:1px solid var(--line)}.critical,.significant{color:var(--danger)}.emerging{color:var(--amber)}.low{color:var(--green)}.empty{color:var(--muted);padding:24px;text-align:center}.alert{padding:11px;border-left:3px solid var(--amber);background:rgba(224,160,64,.06);border-radius:8px;margin:8px 0;color:var(--muted)}.bars .row{display:grid;grid-template-columns:110px 1fr 35px;gap:8px;align-items:center;margin:9px 0;font-size:12px}.bar{height:9px;background:#07111f;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--cyan)}@media(max-width:900px){.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.case{grid-template-columns:1fr 1fr}}@media(max-width:760px){.wrap{padding:16px 10px 44px}.metric,.card{padding:13px}.case{font-size:13px}.bars .row{grid-template-columns:90px 1fr 28px}}
@media(max-width:520px){.hero{display:block}.metrics{grid-template-columns:1fr 1fr}.case{grid-template-columns:1fr}.btn{margin-top:12px}}
</style><link rel="stylesheet" href="mobile.css">
</head><body><main class="wrap"><div class="hero"><div><div class="eyebrow">BIL Professional Suite · v3.1.0</div><h1>Manager Dashboard</h1><p class="lead">Local overview of case status, behavioural pressure, review dates and risk signals on this device.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="window.self!==window.top?parent.postMessage('home','*'):location.href='/'">← Suite</button><button class="btn" onclick="location.href='cases.html'">Open Case Workspace</button></div></div><div id="metrics" class="metrics"></div><div class="grid"><section class="card"><h2>Case overview</h2><div id="cases"></div></section><section><div class="card"><h2>Attention queue</h2><div id="alerts"></div></div><div class="card" style="margin-top:14px"><h2>Case mix</h2><div id="mix" class="bars"></div></div></section></div></main><script>
const KEY='bil-cases-v2';let cases=[];try{cases=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{};const now=new Date();const riskRank={Critical:4,Significant:3,Emerging:2,Low:1,'Not assessed':0};const open=cases.filter(c=>!['Closed','Archived'].includes(c.status));const high=cases.filter(c=>['Critical','Significant'].includes(c.risk));const review=cases.filter(c=>c.status==='Review');const overdue=cases.filter(c=>c.review&&new Date(c.review)<new Date(now.toDateString())&&!['Closed','Archived'].includes(c.status));const red=cases.reduce((n,c)=>n+(c.events||[]).filter(e=>e.state==='RED').length,0);const docs=cases.reduce((n,c)=>n+(c.documents||[]).length,0);const submitted=cases.filter(c=>['Submitted','Changes requested'].includes((c.approval||{}).status)).length;const approved=cases.filter(c=>(c.approval||{}).status==='Approved').length;document.getElementById('metrics').innerHTML=[[cases.length,'Total cases'],[open.length,'Open cases'],[high.length,'High risk'],[review.length,'In review'],[overdue.length,'Overdue review'],[red,'Red events'],[submitted,'Approval queue'],[approved,'Approved']].map(x=>`<div class="metric"><div class="n">${x[0]}</div><div class="l">${x[1]}</div></div>`).join('');const sorted=[...cases].sort((a,b)=>(riskRank[b.risk]||0)-(riskRank[a.risk]||0)||(b.updated||0)-(a.updated||0));document.getElementById('cases').innerHTML=sorted.length?sorted.map(c=>`<div class="case" role="button" tabindex="0" onclick="location.href='cases.html#'+encodeURIComponent(c.id||'')"><div><b>${c.ref||'Unreferenced'}</b><div style="color:var(--muted);font-size:12px">${c.type||''} · ${c.initials||''}</div></div><span>${c.practitioner||'Unassigned'}</span><span class="pill ${(c.risk||'').toLowerCase().replace(' ','-')}">${c.risk||'Not assessed'}</span><span>${c.status||'Open'}</span></div>`).join(''):'<div class="empty">No local cases found.</div>';const alerts=[];submitted&&alerts.push(`${submitted} case${submitted===1?'':'s'} awaiting supervisor action.`);high.forEach(c=>alerts.push(`${c.ref}: ${c.risk} risk recorded.`));overdue.forEach(c=>alerts.push(`${c.ref}: review date overdue.`));cases.filter(c=>(c.events||[]).some(e=>e.state==='RED')).forEach(c=>alerts.push(`${c.ref}: one or more Red events recorded.`));document.getElementById('alerts').innerHTML=alerts.length?alerts.slice(0,12).map(x=>`<div class="alert">${x}</div>`).join(''):'<div class="empty">No automatic attention alerts.</div>';const types={};cases.forEach(c=>types[c.type]=(types[c.type]||0)+1);const max=Math.max(1,...Object.values(types));document.getElementById('mix').innerHTML=Object.entries(types).map(([k,v])=>`<div class="row"><span>${k}</span><div class="bar"><div class="fill" style="width:${v/max*100}%"></div></div><b>${v}</b></div>`).join('')||'<div class="empty">No case data.</div>';
</script></body></html>
