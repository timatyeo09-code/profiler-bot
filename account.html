<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>My account · BIL Professional Suite</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:32px 18px;background:linear-gradient(160deg,#07111f,#10253f);color:#f4f7fb;font-family:Inter,system-ui,sans-serif}.wrap{max-width:620px;margin:40px auto}.eyebrow{color:#61b7ff;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}h1{font-size:38px;margin:12px 0}.lead,.hint{color:#9fb0c5;line-height:1.6}.card{padding:24px;border:1px solid #24405f;border-radius:20px;background:#0e1b2e}dt{margin:20px 0 6px;color:#9fb0c5;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}dt:first-child{margin-top:0}dd{margin:0;overflow-wrap:anywhere;line-height:1.5}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.btn{border:1px solid #24405f;border-radius:10px;padding:12px 16px;color:#f4f7fb;background:#10253f;text-decoration:none;font:inherit;cursor:pointer}.primary{background:#2478ff}.btn:focus-visible{outline:2px solid #61b7ff;outline-offset:3px}[hidden]{display:none!important}#accountId{font-family:ui-monospace,monospace;font-size:14px}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="eyebrow">Behavioural Intelligence Lab</div>
    <h1>My account</h1>
    <p class="lead">Your registration details and permanent user ID.</p>
    <p id="status" class="hint" role="status">Loading your account…</p>
    <section id="details" class="card" hidden aria-label="Account details">
      <dl>
        <dt>Full name</dt><dd id="accountName"></dd>
        <dt>Organisation</dt><dd id="accountOrganisation"></dd>
        <dt>Email</dt><dd id="accountEmail"></dd>
        <dt>User ID</dt><dd id="accountId"></dd>
      </dl>
      <p class="hint">Your ID is assigned automatically when your account is created and stays the same each time you sign in.</p>
    </section>
    <div class="actions">
      <a class="btn primary" href="/">Open the suite</a>
      <button class="btn" id="signOut" type="button" hidden>Sign out</button>
    </div>
  </main>
  <script src="js/bil-auth.js"></script>
  <script>
    async function showAccount(){
      const data=await BILAuth.init();
      if(data.mode!=='authenticated'){
        document.getElementById('status').textContent='Individual accounts are not available yet.';
        return;
      }
      const values={
        accountName:data.profile?.full_name||data.user.full_name||'Not provided',
        accountOrganisation:data.user.organisation_name||'Not provided',
        accountEmail:data.user.email||'Not provided',
        accountId:data.user.id
      };
      for(const [id,value] of Object.entries(values))document.getElementById(id).textContent=value;
      document.getElementById('details').hidden=false;
      document.getElementById('signOut').hidden=false;
      document.getElementById('status').hidden=true;
    }
    document.getElementById('signOut').onclick=()=>BILAuth.signOut().catch(()=>{
      const status=document.getElementById('status');
      if(status){status.hidden=false;status.textContent='Could not sign out. Please try again.';}
    });
    showAccount().catch(()=>{
      const status=document.getElementById('status');
      if(status)status.textContent='Could not load your account. Please sign in again.';
    });
  </script>
</body>
</html>
